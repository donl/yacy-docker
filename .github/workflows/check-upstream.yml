name: Check Upstream for Updates

on:
  schedule:
    - cron: '0 8 * * *'  # Daily 8 AM UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Get latest upstream commit
        id: upstream
        run: |
          SHA=$(curl -s "https://api.github.com/repos/yacy/yacy_search_server/commits?sha=master&per_page=1" \
            | jq -r '.[0].sha[0:12]')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Upstream SHA: $SHA"

      - name: Check if we already built this commit
        id: cache
        uses: actions/cache@v4
        with:
          path: .last-built-sha
          key: upstream-sha-${{ steps.upstream.outputs.sha }}

      - name: Trigger build if new commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > .last-built-sha
          echo "New upstream commit detected, triggering build..."
          gh workflow run build.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: No update needed
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Already built ${{ steps.upstream.outputs.sha }}, skipping."
