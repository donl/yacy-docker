name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      yacy_version:
        description: 'YaCy version (tag, branch, or "all" for all releases)'
        required: false
        default: 'master'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Discover which YaCy versions to build
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine versions to build
        id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.yacy_version || 'master' }}"

          if [ "$INPUT" = "all" ]; then
            # Fetch all release tags + master
            TAGS=$(curl -s "https://api.github.com/repos/yacy/yacy_search_server/releases?per_page=10" \
              | jq -r '.[].tag_name' 2>/dev/null)
            VERSIONS=$(echo "$TAGS" | jq -Rsc 'split("\n") | map(select(length > 0)) + ["master"]')
          else
            VERSIONS=$(echo "[\"$INPUT\"]")
          fi

          echo "matrix=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Building versions: $VERSIONS"

  build:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        yacy_version: ${{ fromJson(needs.versions.outputs.matrix) }}
        variant:
          - dockerfile: docker/Dockerfile
            tag: ubuntu
            platform: linux/amd64
          - dockerfile: docker/Dockerfile.alpine
            tag: alpine
            platform: linux/amd64
          - dockerfile: docker/Dockerfile.aarch64
            tag: aarch64
            platform: linux/arm64
          - dockerfile: docker/Dockerfile.armv7
            tag: armv7
            platform: linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM builds)
        uses: docker/setup-qemu-action@v3
        if: matrix.variant.platform != 'linux/amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version metadata
        id: version
        run: |
          VERSION="${{ matrix.yacy_version }}"
          echo "yacy_version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          # Get commit SHA
          SHA=$(curl -s "https://api.github.com/repos/yacy/yacy_search_server/commits?sha=$VERSION&per_page=1" \
            | jq -r '.[0].sha[0:7] // empty' 2>/dev/null || echo "unknown")
          echo "yacy_sha=$SHA" >> $GITHUB_OUTPUT

          # Clean version for tag (Release_1.941 -> 1.941)
          CLEAN=$(echo "$VERSION" | sed 's/^Release_//')
          echo "clean_version=$CLEAN" >> $GITHUB_OUTPUT

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # version-variant (e.g., 1.941-alpine, master-ubuntu)
            type=raw,value=${{ steps.version.outputs.clean_version }}-${{ matrix.variant.tag }}
            # variant only for master (e.g., alpine, ubuntu)
            type=raw,value=${{ matrix.variant.tag }},enable=${{ matrix.yacy_version == 'master' }}
            # latest = master + ubuntu
            type=raw,value=latest,enable=${{ matrix.yacy_version == 'master' && matrix.variant.tag == 'ubuntu' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: ${{ matrix.variant.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YACY_VERSION=${{ steps.version.outputs.yacy_version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            YACY_SHA=${{ steps.version.outputs.yacy_sha }}
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-${{ steps.version.outputs.clean_version }}
          cache-to: type=gha,scope=${{ matrix.variant.tag }}-${{ steps.version.outputs.clean_version }},mode=max
