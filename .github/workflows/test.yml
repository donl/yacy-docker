name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: chmod +x bin/*.sh && ./bin/test.sh unit

  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error
        continue-on-error: true

      - name: Lint Alpine
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.alpine
          failure-threshold: error
        continue-on-error: true

  build-and-test:
    name: Build & Integration Test
    runs-on: ubuntu-latest
    needs: [unit, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Alpine image
        run: |
          chmod +x bin/*.sh
          docker build -f docker/Dockerfile.alpine -t yacy:latest \
            --build-arg YACY_VERSION=master \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg YACY_SHA=$(git rev-parse --short HEAD) \
            .

      - name: Set up standalone compose
        run: cp docker-compose.standalone.yml docker-compose.yml

      - name: Start YaCy
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          echo "Waiting for YaCy to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "healthy"; then
              echo "Healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for healthy"
          docker compose logs yacy
          exit 1

      - name: Test web interface
        run: curl -sf http://127.0.0.1:8090/ > /dev/null

      - name: Test hello endpoint
        run: curl -sf http://127.0.0.1:8090/yacy/hello.html | grep -q "uptime="

      - name: Test status script
        run: ./bin/status.sh

      - name: Test set-password
        run: ./bin/set-password.sh yacy testpassword123

      - name: Test backup
        run: ./bin/backup.sh

      - name: Test restore
        run: |
          BACKUP=$(ls -t backups/yacy_*.tar.gz | head -1)
          ./bin/restore.sh -y "$BACKUP"

      - name: Verify healthy after restore
        run: |
          for i in $(seq 1 30); do
            if docker compose ps | grep -q "healthy"; then
              echo "Healthy after restore"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v 2>/dev/null || true
