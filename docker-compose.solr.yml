# Optional Solr service for YaCy federated search
#
# Use as an overlay with any base compose template:
#   docker compose -f docker-compose.yml -f docker-compose.solr.yml up -d
#
# Or symlink as override to auto-include:
#   ln -s docker-compose.solr.yml docker-compose.override.yml
#   docker compose up -d
#
# After starting, initialize collections:
#   ./bin/solr-init.sh

services:
  solr:
    image: solr:9-slim
    container_name: yacy-solr
    restart: unless-stopped

    environment:
      SOLR_HEAP: ${SOLR_HEAP:-2g}
      SOLR_LOG_LEVEL: ${SOLR_LOG_LEVEL:-WARN}

    ports:
      - "${SOLR_PORT:-127.0.0.1:8983}:8983"

    volumes:
      - solr_data:/var/solr

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8983/api/node/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "2"

  # Override yacy service to wait for Solr before starting
  yacy:
    depends_on:
      solr:
        condition: service_healthy

volumes:
  solr_data:
